platform: "fargate"
app_name: "auto-email-labeling"
aws:
  profile: "personal"
  region: "us-east-2"
task:
  cpu: 1024
  memory: 4096
  spot: true
  replicas: 1
  ephemeral_storage: 22
allow_create: true
custom_iam_policy:
  Version: "2012-10-17"
  Statement:
    - Effect: "Allow"
      Action:
        - "secretsmanager:GetSecretValue"
        - "secretsmanager:DescribeSecret"
      Resource: "arn:aws:secretsmanager:us-east-2:*:secret:auto-email-labeling/gmail-refresh-token*"